apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-platform
  namespace: devops-platform

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-platform

  template:
    metadata:
      labels:
        app: devops-platform

    spec:
      containers:
      - name: flask-app
        image: srinivasps/devops-platform:v1
        imagePullPolicy: Always

        ports:
        - containerPort: 5000
